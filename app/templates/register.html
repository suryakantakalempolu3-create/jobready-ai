{% extends "base.html" %}{% block public %}
<div class="container"><nav class="nav-pub"><a class="brand" href="/" style="padding:0"><span class="logo">J</span>JobReady AI</a></nav>
<form class="card auth fade" id="registerForm" novalidate>
  <h1>Create your account</h1><p class="muted">Free for students.</p>
  <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="small muted">At least 8 characters, with a letter and a number.</div></div>
  <div id="formErr" class="small" style="color:var(--bad);min-height:1.2em" role="alert"></div>
  <button class="btn btn-primary" style="width:100%">Create account</button>
  <p class="small muted mt">Already registered? <a href="/login">Log in</a></p>
</form></div>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
